[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-moe-dispatch"
version = "0.2.0"
description = "Single-GPU CUDA MoE forward engine with fused routing, dispatch, grouped GEMMs, and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Aarush Rathore"}]
dependencies = ["torch>=2.4,<3", "ninja>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1"]
notebook = ["nbformat>=5"]
gpu = ["triton==3.6.0; platform_system == 'Linux' and platform_machine == 'x86_64'"]
plot = ["matplotlib>=3.8"]

[project.scripts]
moe-dispatch = "moe_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moe_dispatch = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an NVIDIA GPU, CUDA toolkit, and compatible PyTorch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
